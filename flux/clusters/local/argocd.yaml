---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: argocd
  chart:
    spec:
      chart: argo-cd
      version: "7.x"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: flux-system
  values:
    server:
      extraArgs:
        - --insecure
    configs:
      params:
        server.insecure: true
