apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hrms-db-secret
  namespace: hrms
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hrms-db-secret
    creationPolicy: Owner
  data:
    - secretKey: root-password
      remoteRef:
        key: secret/data/hrms/database
        property: root-password
    - secretKey: user-password
      remoteRef:
        key: secret/data/hrms/database
        property: user-password
