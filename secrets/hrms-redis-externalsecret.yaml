apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hrms-redis-secret
  namespace: hrms
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hrms-redis-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/hrms/redis
        property: password
