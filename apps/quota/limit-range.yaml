apiVersion: v1
kind: LimitRange
metadata:
  name: hrms-limitrange
  namespace: hrms
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 1Gi
      min:
        cpu: 50m
        memory: 64Mi
    - type: Pod
      max:
        cpu: "4"
        memory: 2Gi
    - type: PersistentVolumeClaim
      max:
        storage: 5Gi
      min:
        storage: 100Mi
