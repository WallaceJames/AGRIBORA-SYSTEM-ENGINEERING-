apiVersion: v1
kind: ServiceAccount
metadata:
  name: hrms-monitor
  namespace: hrms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hrms-monitor
  namespace: hrms
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hrms-monitor-binding
  namespace: hrms
subjects:
  - kind: ServiceAccount
    name: hrms-monitor
    namespace: hrms
roleRef:
  kind: Role
  name: hrms-monitor
  apiGroup: rbac.authorization.k8s.io
