apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hrms-developer
  namespace: hrms
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hrms-developer-binding
  namespace: hrms
subjects:
  - kind: Group
    name: hrms-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: hrms-developer
  apiGroup: rbac.authorization.k8s.io
